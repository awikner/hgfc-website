<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homegrown Food Collective</title>
  <meta name="description" content="Homegrown Food Collective — coming soon.">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #2d3a24 url("images/produce.jpg") center / cover no-repeat fixed;
      color: #fff;
      font-family: "Times New Roman", Times, serif;
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
    }
    /* darken the photo so the text stays readable */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.45) 0%, rgba(0,0,0,.65) 100%);
      z-index: 0;
    }
    main { position: relative; z-index: 1; }
    h1 {
      font-weight: 700;
      font-size: clamp(2.4rem, 8vw, 5.5rem);
      line-height: 1.05;
      margin: 0 0 .4em;
      text-shadow: 0 2px 18px rgba(0,0,0,.5);
    }
    p {
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      margin: 0;
      opacity: .92;
    }
    /* keep the title on one line on laptop/desktop screens */
    @media (min-width: 701px) {
      h1 { white-space: nowrap; font-size: min(6.5vw, 6rem); }
    }
    @media (max-width: 700px) {
      /* fixed backgrounds are janky on mobile */
      body { background-attachment: scroll; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Homegrown Food Collective</h1>
    <p>Coming Soon!</p>
  </main>
</body>
</html>
